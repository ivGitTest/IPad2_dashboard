<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Страница рассчитана ровно на 1024x768 (iPad 2, ландшафт), без скролла -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- Полноэкранный режим при запуске с экрана "Домой" (Safari -> Добавить на экран "Домой") -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дашборд">
<title>Погода и время</title>
<style>
/* Только то, что понимает WebKit iOS 9: float/table-cell раскладка,
   градиенты и анимации продублированы с -webkit- префиксами. */
* { margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: #fff;
  background: #16324f;
  background: -webkit-linear-gradient(160deg, #2f6fb3 0%, #16324f 100%);
  background: linear-gradient(160deg, #2f6fb3 0%, #16324f 100%);
  -webkit-user-select: none;
  user-select: none;
  cursor: default;
}
body.night {
  background: #05070f;
  background: -webkit-linear-gradient(160deg, #141b3d 0%, #05070f 100%);
  background: linear-gradient(160deg, #141b3d 0%, #05070f 100%);
}

.half {
  float: left; width: 50%; height: 100%; display: table;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}
.half.left { border-right: 1px solid rgba(255,255,255,.12); }
.cell {
  display: table-cell;
  vertical-align: middle;
  text-align: center;
  padding: 0 20px;
}

/* --- Погода (левая половина) --- */
.w-city {
  font-size: 40px; font-weight: 300;
  letter-spacing: 10px; text-transform: uppercase;
  opacity: .8;
}
/* Текущая погода — верхние 2/3 левой половины (512 px из 768),
   прогноз — нижняя треть (256 px). Центрирование внутри — table-cell. */
/* table-layout: fixed обязателен: иначе широкая строка .w-now раздвинет
   auto-таблицу (width у table — минимум) и правая половина уедет под экран */
.w-main { display: table; table-layout: fixed; width: 100%; height: 512px; }
.w-main-cell { display: table-cell; vertical-align: middle; }
/* Иконка слева, температура справа. Шрифт температуры 230 px — максимум, при
   котором «−23°» (знак + 2 цифры ≈ 425 px, замерено рендером: ширина текста
   ≈ 1.9em) ещё помещается рядом с иконкой в строку шириной 511 px (на всю
   левую половину: margin-left:-20px поверх padding ячейки). 255 px (ровно x1.5)
   не влезает: после «−23°» на иконку осталось бы < 30 px.
   nowrap — температура не переносится; letter-spacing чуть сжимает цифры. */
.w-now { display: table; width: 511px; margin: 6px 0 0 -20px; }
.w-icon { display: table-cell; vertical-align: middle; height: 65px; padding-left: 6px; }
.w-icon svg { width: 65px; height: 65px; }
.w-temp {
  display: table-cell; vertical-align: middle;
  font-size: 230px; font-weight: 100; line-height: 1;
  letter-spacing: -0.015em;
  white-space: nowrap;
}
.w-temp .deg { font-size: .45em; font-weight: 100; vertical-align: .75em; }
.w-desc { font-size: 36px; font-weight: 300; opacity: .9; margin-top: 8px; }
.w-extra { font-size: 27px; font-weight: 300; opacity: .75; margin-top: 20px; }
.w-extra .sep { margin: 0 14px; opacity: .5; }
.w-upd { font-size: 21px; font-weight: 300; opacity: .45; margin-top: 20px;
  -webkit-transition: opacity 1s ease-in-out; transition: opacity 1s ease-in-out; }
/* Устаревшие данные: красный текст; JS каждую секунду переключает .dim,
   transition даёт плавность — период 2 с, как у двоеточия часов.
   Не CSS-keyframes: при проблемах анимаций на старом WebKit остаётся
   хотя бы красный цвет и жёсткое мигание (пока жив JS). */
.w-upd.stale { color: #ff6b6b; opacity: 1; }
.w-upd.stale.dim { opacity: .2; }

/* --- Прогноз на ближайшие 4 часа (нижняя треть левой половины, 256 px) --- */
.w-forecast {
  display: table; table-layout: fixed; width: 100%;
  height: 239px; padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,.12);
}
.f-item { display: table-cell; text-align: center; vertical-align: middle; }
.f-time { font-size: 24px; font-weight: 300; opacity: .6; }
.f-icon { height: 56px; margin-top: 6px; }
.f-icon svg { width: 56px; height: 56px; }
/* Маленькие иконки прогноза статичны: экономим GPU Apple A5
   (специфичность .f-icon svg * выше классов .rays/.drop/... — анимации гаснут) */
.f-icon svg * { -webkit-animation: none; animation: none; }
.f-temp { font-size: 30px; font-weight: 300; margin-top: 4px; }

/* --- Часы (правая половина) --- */
.c-time { font-size: 170px; font-weight: 100; line-height: 1; }
.c-date { font-size: 39px; font-weight: 300; opacity: .8; margin-top: 26px; }
.colon {
  display: inline-block;
  -webkit-animation: blink 2s ease-in-out infinite;
  animation: blink 2s ease-in-out infinite;
}
@-webkit-keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

/* --- Анимации иконок: только transform/opacity, легко для Apple A5 --- */
/* Лучи солнца: вложенная <g> со сдвигом в центр + вращение вокруг локального (0,0),
   чтобы не зависеть от капризного transform-origin в старом WebKit. */
.rays {
  -webkit-transform-origin: 0 0; transform-origin: 0 0;
  -webkit-animation: spin 90s linear infinite;
  animation: spin 90s linear infinite;
}
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

.cloud-front {
  -webkit-animation: drift 8s ease-in-out infinite alternate;
  animation: drift 8s ease-in-out infinite alternate;
}
@-webkit-keyframes drift {
  from { -webkit-transform: translate(-6px, 0); }
  to   { -webkit-transform: translate(6px, 0); }
}
@keyframes drift {
  from { transform: translate(-6px, 0); }
  to   { transform: translate(6px, 0); }
}

/* opacity:1 как база: если CSS-анимации не поддерживаются, капли/снег видны статично */
.drop {
  opacity: 1;
  -webkit-animation: fall 1.7s linear infinite backwards;
  animation: fall 1.7s linear infinite backwards;
}
.d2 { -webkit-animation-delay: .55s; animation-delay: .55s; }
.d3 { -webkit-animation-delay: 1.1s; animation-delay: 1.1s; }
@-webkit-keyframes fall {
  0%   { -webkit-transform: translate(0, -14px); opacity: 0; }
  25%  { opacity: 1; }
  75%  { opacity: 1; }
  100% { -webkit-transform: translate(-7px, 48px); opacity: 0; }
}
@keyframes fall {
  0%   { transform: translate(0, -14px); opacity: 0; }
  25%  { opacity: 1; }
  75%  { opacity: 1; }
  100% { transform: translate(-7px, 48px); opacity: 0; }
}

.flake {
  opacity: 1;
  -webkit-animation: snowfall 2.6s linear infinite backwards;
  animation: snowfall 2.6s linear infinite backwards;
}
.f2 { -webkit-animation-delay: .85s; animation-delay: .85s; -webkit-animation-duration: 3.1s; animation-duration: 3.1s; }
.f3 { -webkit-animation-delay: 1.7s; animation-delay: 1.7s; -webkit-animation-duration: 2.3s; animation-duration: 2.3s; }
@-webkit-keyframes snowfall {
  0%   { -webkit-transform: translate(0, -12px); opacity: 0; }
  20%  { opacity: 1; }
  100% { -webkit-transform: translate(-9px, 50px); opacity: 0; }
}
@keyframes snowfall {
  0%   { transform: translate(0, -12px); opacity: 0; }
  20%  { opacity: 1; }
  100% { transform: translate(-9px, 50px); opacity: 0; }
}

.star { -webkit-animation: twinkle 3.2s ease-in-out infinite; animation: twinkle 3.2s ease-in-out infinite; }
.s2 { -webkit-animation-delay: 1.1s; animation-delay: 1.1s; }
.s3 { -webkit-animation-delay: 2.2s; animation-delay: 2.2s; }
@-webkit-keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
</style>
</head>
<body class="day">

<div class="half left">
  <div class="cell">
    <div class="w-main">
      <div class="w-main-cell">
        <div class="w-city" id="wCity">&hellip;</div>
        <div class="w-now">
          <div class="w-icon" id="wIcon"></div>
          <div class="w-temp"><span id="wTemp">--</span><span class="deg">&deg;</span></div>
        </div>
        <div class="w-desc" id="wDesc">загрузка&hellip;</div>
        <div class="w-extra">
          <span id="wFeels">Ощущается --&deg;</span><span class="sep">&bull;</span><span id="wWind">Ветер -- м/с</span>
        </div>
        <div class="w-upd" id="wUpd"></div>
      </div>
    </div>
    <div class="w-forecast" id="wForecast"></div>
  </div>
</div>

<div class="half right">
  <div class="cell">
    <div class="c-time"><span id="cH">--</span><span class="colon">:</span><span id="cM">--</span></div>
    <div class="c-date" id="cDate"></div>
  </div>
</div>

<script>
/* JavaScript строго ES5: iOS 9 не понимает fetch/let/стрелочные функции. */

// Запрет "резинового" скролла страницы на iPad.
document.ontouchmove = function (e) { e.preventDefault(); };

// ---------- Часы ----------
var DAYS = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
              'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
var elH = document.getElementById('cH');
var elM = document.getElementById('cM');
var elDate = document.getElementById('cDate');
var lastMinute = -1;

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function tick() {
  var d = new Date();
  if (d.getMinutes() !== lastMinute) {
    lastMinute = d.getMinutes();
    elH.innerHTML = pad2(d.getHours());
    elM.innerHTML = pad2(d.getMinutes());
    elDate.innerHTML = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' +
                       MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }
  updateTheme();
}
setInterval(tick, 1000);
tick();

// ---------- Тема день/ночь по восходу/закату ----------
// Координаты приходят от сервера в каждом ответе (w.lat/w.lon, из config.json).
var geoLat = null, geoLon = null;

// Солнце выше -0.833° (диск + рефракция) на момент d? Приближение NOAA —
// то же, что sun_is_up() на сервере, точность ~2 мин.
function sunIsUp(d, lat, lon) {
  var rad = Math.PI / 180;
  var doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  var clockMin = d.getHours() * 60 + d.getMinutes();
  var g = 2 * Math.PI / 365 * (doy - 1 + (clockMin / 60 - 12) / 24);
  var eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
               - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
           - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
           - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  // Истинное солнечное время: местные часы + уравнение времени + долгота
  // (getTimezoneOffset() = -60*tz в минутах, для MSK -180).
  var ha = (clockMin + eqtime + 4 * lon + d.getTimezoneOffset()) / 4 - 180;
  var sinEl = Math.sin(lat * rad) * Math.sin(decl)
            + Math.cos(lat * rad) * Math.cos(decl) * Math.cos(ha * rad);
  return sinEl > -0.01454;  // sin(-0.833°)
}

// Тема по локальным часам iPad, а не по закэшированной погоде: переключается
// ровно в минуту восхода/заката, даже когда кэш погоды устарел.
function updateTheme() {
  if (typeof geoLat !== 'number') { return; }  // координат ещё нет — ждём сервер
  var cls = sunIsUp(new Date(), geoLat, geoLon) ? 'day' : 'night';
  if (document.body.className !== cls) { document.body.className = cls; }
}

// ---------- Иконки погоды (инлайн SVG, без внешних запросов) ----------
var ICONS = {
  sun: '<svg viewBox="0 0 200 200">'
     + '<g transform="translate(100,100)">'
     + '<g class="rays" stroke="#ffca3a" stroke-width="8" stroke-linecap="round">'
     + '<line x1="0" y1="-92" x2="0" y2="-70"/><line x1="0" y1="92" x2="0" y2="70"/>'
     + '<line x1="-92" y1="0" x2="-70" y2="0"/><line x1="92" y1="0" x2="70" y2="0"/>'
     + '<line x1="65" y1="-65" x2="49.5" y2="-49.5"/><line x1="65" y1="65" x2="49.5" y2="49.5"/>'
     + '<line x1="-65" y1="65" x2="-49.5" y2="49.5"/><line x1="-65" y1="-65" x2="-49.5" y2="-49.5"/>'
     + '</g>'
     + '<circle cx="0" cy="0" r="44" fill="#ffd34d"/>'
     + '</g></svg>',

  moon: '<svg viewBox="0 0 200 200">'
      + '<defs><mask id="mcut">'
      + '<rect x="0" y="0" width="200" height="200" fill="#fff"/>'
      + '<circle cx="138" cy="86" r="64" fill="#000"/>'
      + '</mask></defs>'
      + '<circle cx="98" cy="102" r="76" fill="#e8eefc" mask="url(#mcut)"/>'
      + '<circle class="star" cx="168" cy="52" r="3.5" fill="#cfd8ff"/>'
      + '<circle class="star s2" cx="176" cy="108" r="2.8" fill="#cfd8ff"/>'
      + '<circle class="star s3" cx="156" cy="164" r="2.4" fill="#cfd8ff"/>'
      + '</svg>',

  clouds: '<svg viewBox="0 0 200 200">'
        + '<g fill="#8fa1b8" opacity="0.85">'
        + '<circle cx="106" cy="86" r="18"/><circle cx="132" cy="70" r="26"/>'
        + '<circle cx="160" cy="86" r="20"/><rect x="96" y="82" width="80" height="24" rx="12"/>'
        + '</g>'
        + '<g class="cloud-front" fill="#dbe3ee">'
        + '<circle cx="70" cy="118" r="30"/><circle cx="112" cy="96" r="38"/>'
        + '<circle cx="152" cy="120" r="26"/><rect x="54" y="112" width="112" height="34" rx="17"/>'
        + '</g></svg>',

  rain: '<svg viewBox="0 0 200 200">'
      + '<g fill="#c8d4e4">'
      + '<circle cx="70" cy="92" r="28"/><circle cx="108" cy="72" r="35"/>'
      + '<circle cx="146" cy="94" r="24"/><rect x="54" y="88" width="104" height="30" rx="15"/>'
      + '</g>'
      + '<g stroke="#6fb7ff" stroke-width="7" stroke-linecap="round">'
      + '<line class="drop" x1="78" y1="128" x2="72" y2="150"/>'
      + '<line class="drop d2" x1="106" y1="128" x2="100" y2="150"/>'
      + '<line class="drop d3" x1="134" y1="128" x2="128" y2="150"/>'
      + '</g></svg>',

  snow: '<svg viewBox="0 0 200 200">'
      + '<g fill="#c8d4e4">'
      + '<circle cx="70" cy="92" r="28"/><circle cx="108" cy="72" r="35"/>'
      + '<circle cx="146" cy="94" r="24"/><rect x="54" y="88" width="104" height="30" rx="15"/>'
      + '</g>'
      + '<g fill="#eaf4ff">'
      + '<circle class="flake" cx="76" cy="130" r="5"/>'
      + '<circle class="flake f2" cx="106" cy="130" r="5.5"/>'
      + '<circle class="flake f3" cx="136" cy="130" r="5"/>'
      + '</g></svg>'
};

// ---------- Погода ----------
var elCity = document.getElementById('wCity');
var elIcon = document.getElementById('wIcon');
var elTemp = document.getElementById('wTemp');
var elDesc = document.getElementById('wDesc');
var elFeels = document.getElementById('wFeels');
var elWind = document.getElementById('wWind');
var elUpd = document.getElementById('wUpd');
var elForecast = document.getElementById('wForecast');

// Контроль свежести: данные старше STALE_SEC -> надпись мигает красным.
// Порог = refresh_sec сервера (приходит в w.refresh) + запас на опрос (60 c)
// и таймаут fetch, чтобы в норме ложных миганий не было. 720 — дефолт
// (600 + 120) до первого ответа сервера.
var STALE_SEC = 720;
var lastFetched = Date.now() / 1000;  // epoch последнего удачного обновления (от сервера)
var forceStale = false;               // ok:false — данных нет совсем
var blinkDim = false;                 // фаза мигания (переключается раз в секунду)
var netFailures = 0;                  // подряд неудачных запросов к серверу

function checkStale() {
  var stale = forceStale || Date.now() / 1000 - lastFetched > STALE_SEC;
  var cls = 'w-upd';
  if (stale) {
    blinkDim = !blinkDim;
    cls = 'w-upd stale' + (blinkDim ? ' dim' : '');
  }
  if (elUpd.className !== cls) { elUpd.className = cls; }
}
setInterval(checkStale, 1000);

// Типографский минус вместо дефиса.
function fmtDeg(n) { return String(n).replace('-', '−'); }

// Реальный момент обновления: epoch (сек) последнего удачного fetch на сервере
// -> 'ЧЧ:ММ' по локальным часам iPad (согласовано с большими часами справа).
// w.updated для этого не подходит: это часовая метка записи прогноза,
// она стареет вместе с кэшем при обрыве связи.
function fmtFetched(epochSec) {
  var d = new Date(epochSec * 1000);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function renderWeather(w) {
  // Пришли в любом ответе (и при сбое): порог свежести, город и координаты
  // (для темы по восходу/закату). textContent для города — обычный текст.
  if (w.refresh) { STALE_SEC = w.refresh + 120; }
  if (typeof w.lat === 'number' && typeof w.lon === 'number') {
    geoLat = w.lat; geoLon = w.lon;
  }
  if (w.city && elCity.textContent !== w.city) {
    elCity.textContent = w.city;
    document.title = w.city + ' — погода и время';
  }
  if (!w.ok) {
    elDesc.innerHTML = 'нет данных';
    elUpd.innerHTML = 'ошибка обновления';
    forceStale = true;
    checkStale();
    return;
  }
  forceStale = false;
  if (w.fetched) { lastFetched = w.fetched; }
  var icon = w.icon;
  // День/ночь сейчас: по солнцу (координаты от сервера), пока их нет — по
  // w.is_day из кэша. Ночью вместо солнца показываем луну.
  var dayNow = (typeof geoLat === 'number') ? sunIsUp(new Date(), geoLat, geoLon)
                                            : !!w.is_day;
  if (icon === 'sun' && !dayNow) { icon = 'moon'; }
  elIcon.innerHTML = ICONS[icon] || ICONS.clouds;
  document.body.className = dayNow ? 'day' : 'night';
  elTemp.innerHTML = fmtDeg(w.temp);
  elDesc.innerHTML = w.desc;
  elFeels.innerHTML = 'Ощущается ' + fmtDeg(w.feels) + '&deg;';
  elWind.innerHTML = 'Ветер ' + String(w.wind).replace('.', ',') + ' м/с';
  elUpd.innerHTML = 'обновлено в ' + (w.fetched ? fmtFetched(w.fetched) : w.updated);
  checkStale();
  if (w.forecast) { renderForecast(w.forecast); }
}

// Почасовой прогноз: час, маленькая иконка (солнце ночью -> луна), температура.
function renderForecast(list) {
  var html = '';
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    var icon = f.icon;
    if (icon === 'sun' && !f.is_day) { icon = 'moon'; }
    html += '<div class="f-item"><div class="f-time">' + f.time + '</div>'
          + '<div class="f-icon">' + (ICONS[icon] || ICONS.clouds) + '</div>'
          + '<div class="f-temp">' + fmtDeg(f.temp) + '&deg;</div></div>';
  }
  elForecast.innerHTML = html;
}

function fetchWeather() {
  var xhr = new XMLHttpRequest();
  // Параметр t — защита от кэширования старым WebKit.
  xhr.open('GET', '/api/weather?t=' + new Date().getTime(), true);
  // Таймаут обязателен: без него зависшие при обрыве XHR исчерпывают лимит
  // соединений WebKit (~6 на хост) и восстановление связи не обнаружится.
  xhr.timeout = 30000;
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try { renderWeather(JSON.parse(xhr.responseText)); } catch (e) {}
        // Восстановление после обрыва (>= ~3 мин): перезагрузить страницу —
        // подтянется свежая версия кода, сбросится накопившееся состояние.
        if (netFailures >= 3) { location.reload(); return; }
        netFailures = 0;
      } else {
        netFailures++;
      }
    }
  };
  xhr.ontimeout = function () { netFailures++; };
  xhr.send(null);
}
setInterval(fetchWeather, 60000);
fetchWeather();
</script>
